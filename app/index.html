<style>
  /* מסך תיק לרכז נגישות. מבנה קבוע, תוכן משתנה לפי הבחירה. */
  :root {
    --bg-1: #5f7a7c; --bg-2: #2c4042;

  :root[data-size="large"] { --fs: 19px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {

  /* כותרת: לוגו, שם ותפריט */
  header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 26px; background: var(--card); box-shadow: var(--e2), var(--hi); border-radius: 18px; }

  nav.menu a:hover { background: rgba(255,255,255,.1); color: var(--ink); }

  .warn { color: var(--amber-solid); font-weight: 600; }
  .num { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; direction: ltr; font-variant-numeric: tabular-nums; }
  .stack { display: grid; gap: 16px; }

  .grid2 { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; min-width: 0; }

  /* פאנלים וכרטיסים: עומק בשלוש רמות */
  .panel {
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,0) 42%), var(--card);
    border-radius: 22px; padding: 22px; box-shadow: var(--e2), var(--hi); min-width: 0;
  }
  .paper {

  /* כפתורים: מרובעים, עומק ותנועה */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px;
    border: 0; border-radius: 0; background: var(--card-2); color: var(--ink); font: inherit; cursor: pointer; text-decoration: none;
    box-shadow: var(--e1), var(--hi); transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
  }
  .btn:hover { transform: translateY(-3px); box-shadow: var(--e2), var(--hi); }

  .btn.primary { background: var(--paper); color: var(--paper-ink); font-weight: 700; }
  .btn[aria-pressed="true"] { background: var(--paper); color: var(--paper-ink); font-weight: 700; }
  .card .foot > div:first-child { display: grid; justify-items: start; gap: 6px; }

  /* כפתורי בחירה: תיבה מוגבהת, סימון ברור, הרמה בנבחר */
  .choices { display: flex; flex-wrap: wrap; gap: 12px; }
  .choice {
    position: relative; display: inline-flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 18px;
    background: var(--card-2); color: var(--ink); cursor: pointer; box-shadow: var(--e1), var(--hi);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
  }
  .choice:hover { transform: translateY(-3px); box-shadow: var(--e2), var(--hi); }
  .choice:active { transform: translateY(1px); }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .choice:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 3px; }
  .choice .mark { width: 20px; height: 20px; flex: none; border: 2px solid currentColor; display: inline-grid; place-items: center; transition: border-color .25s var(--ease); }
  .choice input[type="radio"] ~ .mark { border-radius: 50%; }
  .choice .mark::after { content: ""; width: 10px; height: 10px; background: currentColor; transform: scale(0); transition: transform .3s var(--ease); }
  .choice:has(input:checked) { background: var(--paper); color: var(--paper-ink); box-shadow: var(--e2); }
  .choice:has(input:checked) .mark::after { transform: scale(1); }
  .choice:has(input:checked) { font-weight: 700; }

  /* מקטע: בורר תצוגה אחד מתוך כמה, במסלול שקוע */

  /* שדות: טקסט שהמשתמש מקליד בשחור על נייר, והקבוע בלבן */
  label.field { display: grid; gap: 8px; }
  label.field > span:first-child { font-weight: 600; }
  input[type="number"], input[type="search"], input[type="text"], textarea {
    font: inherit; color: var(--paper-ink); background: var(--paper); border: 0; border-radius: 0; padding: 11px 14px; min-height: 46px; width: 100%;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.18); caret-color: var(--paper-ink);
  }
  input[type="file"] { color: var(--ink); font: inherit; }

  legend { font-weight: 700; padding: 0; margin-bottom: 8px; }

  /* כרטיסים עם מגמת רמזור שקופה ורכה */
  .cards { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card {
    position: relative; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%), var(--card);
    box-shadow: var(--e2), var(--hi);
    transition: transform .6s var(--ease), box-shadow .6s var(--ease);
    animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms);
  }
  .card:hover { transform: translateY(-10px); box-shadow: var(--e3), var(--hi); }
  .card[data-band="g"] { background-image: linear-gradient(var(--green), var(--green)), linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%); }
  .card[data-band="a"] { background-image: linear-gradient(var(--amber), var(--amber)), linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%); }
  .card[data-band="r"] { background-image: linear-gradient(var(--red), var(--red)), linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%); }
  .card .latin { direction: ltr; text-align: right; color: var(--muted); font-size: .88em; margin: 0; }
  .card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
  .score { font-size: 2.3em; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; direction: ltr; line-height: 1; font-weight: 600; }
  .band { display: inline-block; padding: 3px 10px; font-weight: 700; font-size: .9em; color: var(--paper-ink); }
  .band.g { background: var(--green-solid); }
  .band.a { background: var(--amber-solid); }
  .band.r { background: var(--red-solid); }
  .pill-verify { color: var(--amber-solid); font-size: .88em; }
  .empty { text-align: center; padding: 34px 18px; border: 1px dashed rgba(255,255,255,.55); }

  /* מגמה: פס רמזור שקוף ורך לפי התפלגות */
  .trend { display: flex; height: 18px; overflow: hidden; background: rgba(0,0,0,.2); box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .trend span { display: block; height: 100%; transform-origin: right; animation: grow 1s var(--ease) both; }
  .trend .g { background: rgba(130, 235, 170, .7); }
  .trend .a { background: rgba(255, 216, 120, .7); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .95em; }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-inline-end: 6px; vertical-align: -2px; }

  .table-wrap { overflow-x: auto; background: rgba(0,0,0,.12); box-shadow: inset 0 2px 6px rgba(0,0,0,.25); }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,.2); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .92em; background: rgba(0,0,0,.14); }
  tbody tr { transition: background .25s var(--ease); }
  tbody tr[data-band="g"] td { background: var(--green); }
  tbody tr[data-band="a"] td { background: var(--amber); }
  tbody tr[data-band="r"] td { background: var(--red); }
  tbody tr:hover td { filter: brightness(1.08); }
  .sort { font: inherit; color: inherit; background: none; border: 0; padding: 4px 2px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .sort:hover { color: var(--ink); text-decoration: underline; }
  th[aria-sort="ascending"] .sort::after, th[aria-sort="descending"] .sort::after { content: ""; border: 5px solid transparent; }

  th[aria-sort="descending"] .sort::after { border-top: 6px solid currentColor; margin-top: 6px; }

  /* המלצות ותובנות */
  .ins { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

  @media (max-width: 640px) { .ins li { grid-template-columns: 1fr; gap: 8px; } }
  main:focus { outline: none; }
  .ins .k { font-weight: 700; padding: 2px 10px; background: var(--paper); color: var(--paper-ink); font-size: .88em; white-space: nowrap; }

  /* דף פתיחה */
  .hero { position: relative; overflow: hidden; padding: 40px 26px; background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,0) 45%), var(--card); box-shadow: var(--e3), var(--hi); }
  .hero .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.32), rgba(255,255,255,0) 60%); filter: blur(2px); pointer-events: none; animation: float 9s ease-in-out infinite; }
  .hero .orb.o1 { width: 220px; height: 220px; top: -60px; left: -40px; }

  .hero h1 { font-size: clamp(1.7em, 4.6vw, 2.5em); max-width: 22ch; position: relative; }

  .steps { counter-reset: st; }
  .step { position: relative; padding: 18px 18px 18px 18px; background: rgba(0,0,0,.16); box-shadow: var(--e1), var(--hi); animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 120ms); }
  .step b.n { display: inline-grid; place-items: center; width: 36px; height: 36px; background: var(--paper); color: var(--paper-ink); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; margin-bottom: 10px; box-shadow: var(--e1); }

  /* הודעה קופצת */
  #toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right,0px)); background: var(--paper); color: var(--paper-ink); box-shadow: var(--e3); padding: 12px 18px; max-width: min(92vw, 420px); z-index: 30; animation: rise .4s var(--ease) both; }
  #toast[hidden] { display: none; }
  .foot-note { margin-top: 44px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.25); }

  .enter { animation: rise .7s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @media (max-width: 640px) { .wrap { padding-top: 12px; } h1 { font-size: 1.4em; } .hero { padding: 26px 18px; } }

  @media (prefers-reduced-motion: reduce) {

  }
  :root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
  :root[data-motion="reduce"] .card:hover, :root[data-motion="reduce"] .btn:hover, :root[data-motion="reduce"] .choice:hover { transform: none; }
</style>

  /* ========== מנוע ההתאמה: חמישה פרמטרים, סה"כ 100 ========== */
  function scoreTech(tech, c) {
    const parts = {};
    parts.domain = tech.domain === c.domain ? (tech.coverage === "full" ? 40 : 20) : 0;
    parts.env = c.envs.length ? Math.round(20 * c.envs.filter(e => tech.envs.includes(e)).length / c.envs.length) : 10;
    if (c.budget == null) parts.budget = 20;
    else if (tech.priceMin == null) parts.budget = 10;
    else if (tech.priceMin <= c.budget) parts.budget = 20;
    else parts.budget = Math.max(0, Math.round(20 - 20 * (tech.priceMin - c.budget) / c.budget));
    parts.level = (c.pref === "both" || c.pref === tech.tier) ? 10 : 0;
    parts.severity = tech.severity.includes(c.severity) ? 10 : 4;
    const total = parts.domain + parts.env + parts.budget + parts.level + parts.severity;
    return { total, parts };

  function rankFor(c) {

    }
    if (c.budget != null && ranked.every(r => r.tech.priceMin == null)) {
      out.push({ k: "בדיקה", t: "אין מחיר מאומת לאף פריט, ולכן התקציב לא נבדק בפועל. יש לאמת מחירים לפני החלטה." });

    return out;
  }

    root.querySelectorAll("[data-count]").forEach(el => {
      const to = Number(el.dataset.count);

      const t0 = performance.now(), dur = 800;
      const step = (t) => {

  function makeSortable(table) {
    const ths = Array.from(table.querySelectorAll("thead th[data-sort]"));

      const label = th.textContent.trim();
      th.textContent = "";
      const btn = document.createElement("button");

        const val = (row) => { const cell = row.cells[idx]; return cell.dataset.v !== undefined ? cell.dataset.v : cell.textContent.trim(); };

        rows.forEach(r => tbody.appendChild(r));

            <legend>4. העדפת רמת טכנולוגיה</legend>

          <label class="field"><span>5. תקציב מקסימלי בש"ח (אופציונלי)</span>
            <input type="number" name="budget" min="0" step="1" inputmode="numeric" aria-describedby="h-budget">
            <span id="h-budget" class="muted">אם לא מוזן, התקציב לא מגביל את הדירוג. המחירים בקטלוג עדיין לא אומתו.</span>
          </label>
          <label class="field"><span>6. הערות לתיק (אופציונלי)</span>
            <textarea name="notes" maxlength="600" placeholder="למשל: הסטודנט מבקש שהחומר יישלח מראש."></textarea>
          </label>

        </form>
      </section>`;
    const form = $("#intake");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const domain = fd.get("domain");
      const envs = fd.getAll("env");
      let bad = null;
      $("#e-domain").textContent = ""; $("#e-env").textContent = "";
      if (!domain) { $("#e-domain").textContent = "יש לבחור תחום אחד כדי להמשיך."; bad = form.querySelector('[name="domain"]'); }
      if (envs.length === 0) { $("#e-env").textContent = "יש לבחור לפחות סביבה אחת."; bad = bad || form.querySelector('[name="env"]'); }
      if (bad) { bad.focus(); return; }
      const bRaw = fd.get("budget");
      const budget = bRaw === "" || bRaw === null ? null : Math.max(0, Number(bRaw));
      const c = {
        id: uid(), internalId: nextInternalId(), created: new Date().toISOString(),
        domain, severity: fd.get("severity"), envs, pref: fd.get("pref"),
        budget: Number.isFinite(budget) ? budget : null,
        notes: String(fd.get("notes") || "").trim().slice(0, 600),
        added: [], audio: []
      };
      db.cases.push(c);
      if (save()) toast(`נפתח תיק ${c.internalId}`);
      location.hash = "case-" + c.id;
    });
  }

        <div class="grid2" style="margin-top:16px">

              : `<ul style="padding-inline-start:18px;margin:0">${added.map(t => `<li><a href="#tech-${esc(c.id)}-${esc(t.id)}">${esc(t.name)}</a></li>`).join("")}</ul>`}

        <div class="grid2" style="margin-top:20px">

            <label class="field"><span>הוספת קובץ שמע</span><input type="file" id="audio-in" accept="audio/*"></label>
            ${c.audio.length === 0 ? `<p class="muted">אין הקלטות בתיק.</p>` : c.audio.map((a, i) => `
              <div class="paper stack" style="gap:8px">

                <audio controls preload="none" src="${esc(a.dataUrl)}" style="width:100%"></audio>
                <div class="row"><button class="btn small" type="button" data-rm-audio="${i}">הסרת ההקלטה</button></div>
              </div>`).join("")}
          </div>
        </div>

        <h2>המלצות ותובנות</h2>
        <div class="panel">${insightList(insightsFor(c, ranked))}</div>

        <div class="cards">${top.map((r, i) => cardHtml(c, r, i)).join("")}</div>
      </section>`;

    $("#copy-summary").addEventListener("click", () => copyText(summaryText(c)));
    $("#save-notes").addEventListener("click", () => {
      c.notes = $("#notes").value.trim().slice(0, 600);
      if (save()) toast("ההערות נשמרו");
    });
    $("#audio-in").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("audio/")) { toast("נבחר קובץ שאינו שמע. לא נוסף."); return; }
      if (file.size > MAX_AUDIO) { toast("הקובץ גדול מ-1.5MB. נסו הקלטה קצרה יותר."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        c.audio.push({ name: file.name, dataUrl: reader.result, at: new Date().toISOString() });
        if (save()) { toast("ההקלטה נוספה"); viewCase(c.id); }
      };
      reader.onerror = () => toast("לא הצלחנו לקרוא את הקובץ.");
      reader.readAsDataURL(file);
    });
    main.querySelectorAll("[data-rm-audio]").forEach(btn => btn.addEventListener("click", () => {
      c.audio.splice(Number(btn.dataset.rmAudio), 1);
      if (save()) viewCase(c.id);
    }));
    bindCardActions();
    countUps(main);
  }

  function summaryText(c) {
    const lines = [
      `תיק ${c.internalId}, ${DOMAIN[c.domain]}`,
      `חומרה: ${SEV[c.severity]}. סביבות: ${c.envs.map(e => ENV[e]).join(", ")}. העדפה: ${PREF[c.pref]}.`,
      c.budget == null ? "תקציב: לא הוזן." : `תקציב: עד ${c.budget} ש"ח.`,
      "", "פריטים בתיק:"
    ];
    const added = c.added.map(techById).filter(Boolean);
    if (added.length === 0) lines.push("לא נוספו פריטים.");
    added.forEach(t => {
      const r = scoreTech(t, c);
      lines.push(`- ${t.name} (${t.latin}), ${PREF[t.tier]}, ציון ${r.total}. ${t.limits}`);
    });
    if (c.notes) lines.push("", "הערות: " + c.notes);
    if (c.audio.length) lines.push("", `הקלטות מצורפות: ${c.audio.length}.`);
    lines.push("", "הציונים מחושבים לפי כללי המנוע בלבד. ההחלטה הסופית נשארת לאיש המקצוע.");
    return lines.join("\n");
  }

  function cardHtml(c, r, i = 0) {
    const t = r.tech;
    const inFile = c.added.includes(t.id);
    return `
      <article class="card" data-band="${bandKey(r.total)}" style="--i:${i}" aria-labelledby="t-${t.id}">
        <div class="row" style="justify-content:space-between">
          <span class="tag">${esc(PREF[t.tier])}</span>
          <span class="muted">${esc(DOMAIN[t.domain])}</span>
        </div>
        <h3 id="t-${t.id}">${esc(t.name)}</h3>
        <p class="latin">${esc(t.latin)}</p>
        <p>${esc(t.forWhom)}</p>
        <div class="foot">
          <div class="stack" style="gap:6px"><span class="score" data-count="${r.total}" aria-label="ציון ${r.total} מתוך 100">${r.total}</span>${bandChip(r.total)}</div>
          <div class="row">
            <button class="btn small" type="button" data-add="${esc(c.id)}|${esc(t.id)}" aria-pressed="${inFile}">${inFile ? "בתיק" : "הוסף לתיק"}</button>

          </div>
        </div>
      </article>`;
  }

  function bindCardActions() {
    main.querySelectorAll("[data-add]").forEach(btn => {
      btn.addEventListener("click", () => {
        const [caseId, techId] = btn.dataset.add.split("|");
        const c = caseById(caseId); if (!c) return;
        const on = !c.added.includes(techId);
        c.added = on ? [...c.added, techId] : c.added.filter(x => x !== techId);
        save();
        toast(on ? `נוסף לתיק ${c.internalId}` : `הוסר מהתיק ${c.internalId}`);
        const route = location.hash;
        if (route === "#case-" + c.id || route === "#results-" + c.id) render();
      });
    });
  }

          ].map(([t, d], i) => `<article class="card" style="--i:${i}"><h3>${esc(t)}</h3><p>${esc(d)}</p><p class="pill-verify">מקור ותאריך עדכון: טרם אומתו</p></article>`).join("")}
        </div>
        <h2>שאלות לשיחה עם הסטודנט</h2>
        <ul class="panel" style="padding-inline-start:40px">
          <li>האם הסטודנט כבר קיבל התאמה או ציוד דרך המוסד?</li>
          <li>האם יש מסמך אבחון עדכני, ומאיזה גורם הוא הונפק?</li>
          <li>באיזו מסגרת הטכנולוגיה תשמש: לימוד, מבחנים או שניהם?</li>
        </ul>
      </section>`;
  }

  function viewData(msg) {
    setNav("data");
    const json = JSON.stringify(db, null, 2);
    main.innerHTML = `
      <section class="enter">
        <h1>ייצוא וייבוא</h1>
        <p class="lede">הנתונים נשמרים בדפדפן הזה בלבד. לגיבוי או להעברה למחשב אחר: מעתיקים את הטקסט ושומרים אותו אצלכם. בייבוא מדביקים טקסט שיוצא מכאן. הקלטות נכללות בייצוא ולכן הוא עשוי להיות גדול.</p>
        ${msg ? `<p class="warn" role="status">${esc(msg)}</p>` : ""}
        <div class="panel stack" style="margin-top:18px">
          <label class="field"><span>ייצוא: כל התיקים (JSON)</span><textarea class="ltr" id="out" readonly>${esc(json)}</textarea></label>
          <div class="row"><button class="btn" id="copy-out" type="button">העתקת הנתונים</button></div>
        </div>
        <div class="panel stack" style="margin-top:20px">
          <label class="field"><span>ייבוא: הדביקו כאן את הטקסט</span><textarea class="ltr" id="in" placeholder='{ "cases": [] }'></textarea></label>
          <p class="muted">ייבוא מחליף את כל התיקים הקיימים בדפדפן הזה. לפני ייבוא מומלץ לייצא קודם.</p>
          <div class="row"><button class="btn" id="do-import" type="button">ייבוא והחלפה</button></div>
        </div>
      </section>`;
    $("#copy-out").addEventListener("click", () => copyText(json));
    $("#do-import").addEventListener("click", () => {
      const raw = $("#in").value.trim();
      let parsed;
      try { parsed = JSON.parse(raw); } catch (e) { return viewData("הטקסט אינו JSON תקין. לא בוצע ייבוא."); }
      if (!parsed || !Array.isArray(parsed.cases)) return viewData("המבנה אינו תואם. נדרש שדה cases שהוא רשימה.");
      const clean = parsed.cases.filter(c => c && typeof c.id === "string" && (c.domain === "vision" || c.domain === "attention"));
      db = Object.assign(blank(), { ...parsed, cases: clean.map(c => ({ ...c, added: Array.isArray(c.added) ? c.added.filter(x => techById(x)) : [], audio: Array.isArray(c.audio) ? c.audio : [], notes: c.notes || "" })) });
      if (save()) { toast(`יובאו ${clean.length} תיקים`); location.hash = "home"; }
    });
  }

  function viewSettings() {
    setNav("settings");
    const s = db.settings;
    main.innerHTML = `
      <section class="enter">
        <h1>הגדרות תצוגה</h1>
        <p class="lede">ההגדרות נשמרות בדפדפן הזה, ולא משפיעות על נתוני התיקים.</p>
        <form class="panel stack" id="set" style="margin-top:18px">
          <fieldset><legend>גודל טקסט</legend>
            <div class="choices" role="radiogroup">
              ${choice("size", "normal", "רגיל", s.size !== "large")}
              ${choice("size", "large", "גדול", s.size === "large")}
            </div>
          </fieldset>
          <fieldset><legend>ניגודיות</legend>
            <div class="choices" role="radiogroup">
              ${choice("contrast", "normal", "רגילה", s.contrast !== "high")}
              ${choice("contrast", "high", "גבוהה", s.contrast === "high")}
            </div>
          </fieldset>
          <fieldset><legend>תנועה</legend>
            <div class="choices" role="radiogroup">
              ${choice("motion", "system", "לפי המערכת", s.motion !== "reduce")}
              ${choice("motion", "reduce", "תנועה מופחתת", s.motion === "reduce")}
            </div>
          </fieldset>
          <div class="row"><button class="btn primary" type="submit">שמירה</button></div>
        </form>
      </section>`;
    $("#set").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      db.settings = { size: fd.get("size"), contrast: fd.get("contrast"), motion: fd.get("motion") };
      applySettings();
      if (save()) toast("ההגדרות נשמרו");
    });
  }

  function viewMissing() {
    setNav("home");
    main.innerHTML = `<section class="enter"><h1>הדף לא נמצא</h1><p>ייתכן שהתיק נמחק או שהקישור ישן. אפשר לחזור לרשימת התיקים.</p><div class="row"><a class="btn primary" href="#home">לרשימת התיקים</a></div></section>`;
  }

  function applySettings() {
    const root = document.documentElement;
    root.dataset.size = db.settings.size === "large" ? "large" : "normal";
    root.dataset.contrast = db.settings.contrast === "high" ? "high" : "normal";
    root.dataset.motion = db.settings.motion === "reduce" ? "reduce" : "system";
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("הועתק"); }
    catch (e) { toast("ההעתקה לא זמינה כאן. בחרו את הטקסט והעתיקו ידנית."); }
  }

  /* ========== ניתוב, לפי hash פשוט ========== */
  function render() {
    const h = (location.hash || "#start").slice(1);
    let m;
    applySettings();
    if ((m = h.match(/^case-(c[a-z0-9]+)$/))) return viewCase(m[1]);
    if ((m = h.match(/^results-(c[a-z0-9]+)$/))) return viewResults(m[1]);
    if ((m = h.match(/^tech-(c[a-z0-9]+)-([a-z0-9-]+)$/))) return viewTech(m[1], m[2]);
    switch (h) {
      case "start": case "": return viewStart();
      case "home": return viewHome();
      case "new": return viewNew();
      case "catalog": return viewCatalog();
      case "rights": return viewRights();
      case "data": return viewData();
      case "settings": return viewSettings();
      default: return viewMissing();
    }
  }
  function route() {
    render();
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
